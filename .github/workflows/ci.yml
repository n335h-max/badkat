name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: badkat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: badkat/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: badkat/src-tauri

      - name: Install dependencies
        run: npm ci
      - name: Verify synchronized versions
        run: node scripts/check-version.mjs
      - name: Test JavaScript and accessibility
        run: npm test
      - name: Check Rust formatting
        working-directory: badkat/src-tauri
        run: cargo fmt --all -- --check
      - name: Test Rust
        working-directory: badkat/src-tauri
        run: cargo test --locked
      - name: Lint Rust
        working-directory: badkat/src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Build testable Windows installers
        run: npm run build -- --config src-tauri/tauri.ci.conf.json
      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: badkat-windows-${{ github.sha }}
          path: |
            badkat/src-tauri/target/release/bundle/nsis/*.exe
            badkat/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
