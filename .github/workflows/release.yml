name: Release

# Tag a version and this builds the installer, signs it, and publishes
# the release together with the latest.json the in-app updater reads.
#
# Needs one repository secret before the first run:
#   TAURI_SIGNING_PRIVATE_KEY  — contents of the updater private key
# (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key was given one).
# The matching PUBLIC key is already committed in tauri.conf.json; an
# update signed with a different key will be refused by the installed
# app, which is the whole point of signing it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: badkat/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: badkat/src-tauri

      - name: Install dependencies
        working-directory: badkat
        run: npm ci

      - name: Verify release version
        working-directory: badkat
        run: node scripts/check-version.mjs "${{ github.ref_name }}"

      - name: Test JavaScript and accessibility
        working-directory: badkat
        run: npm test

      - name: Check Rust formatting
        working-directory: badkat/src-tauri
        run: cargo fmt --all -- --check

      - name: Test Rust
        working-directory: badkat/src-tauri
        run: cargo test --locked

      - name: Lint Rust
        working-directory: badkat/src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: badkat
          tagName: ${{ github.ref_name }}
          releaseName: "BadKat ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          # the updater fetches this by a fixed name from /latest/download
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Download draft assets for verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --dir release-assets

      - name: Verify installers and updater metadata
        working-directory: badkat
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          node scripts/verify-release-assets.mjs "..\release-assets" $version

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
